[project]
name = "navigation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jakob Degen", email = "jakob.degen235@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "panda3d>=1.10.16",
    "pandas>=3.1.0",
    "pyserial>=3.5",
    "rerun-sdk>=0.43.1",
    "nslpy",
    "matplotlib>=3.11.2",
]

[project.scripts]
datadump = "navigation.datadump.main:main"
nslp-live = "navigation.rerun.nslp_live.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "types-panda3d>=0.4.1",
]

[tool.uv.sources]
nslpy = { path = "nslpy", editable = true }
